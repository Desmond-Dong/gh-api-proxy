<body>
<h1>GitHub API Proxy</h1>
<p>这是部署在 EdgeOne Pages 边缘节点的 GitHub API 反向代理。</p>
<p>API 入口：<code>/api/github/&lt;path&gt;</code>，需携带 <code>x-proxy-key</code> 请求头或 <code>?key=</code> 参数。</p>
<p>未携带密钥的请求返回 <code>401</code>。</p>
</body>
</html>
